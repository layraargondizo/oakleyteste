<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Óculos Virtual - Correção Definitiva</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  video, canvas {
    position: absolute;
    left: 50%;
    /* Mantendo seu espelho CSS */
    transform: translateX(-50%) scaleX(-1);
    max-width: 100%;
  }
  .botoes { position: fixed; bottom: 20px; width: 100%; text-align: center; z-index: 10; }
  button { padding: 10px 15px; margin: 5px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>

<video id="video" autoplay playsinline style="display:none;"></video>
<canvas id="canvas"></canvas>

<div class="botoes">
  <button onclick="glassesImg.src='https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png'">Resetar Óculos</button>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const glassesImg = new Image();
glassesImg.src = "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png";

async function iniciarCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ 
    video: { width: 640, height: 480 } 
  });
  video.srcObject = stream;
  return new Promise(resolve => { video.onloadedmetadata = () => resolve(); });
}

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(results => {
  if (!canvas.width || !canvas.height) {
     canvas.width = video.videoWidth;
     canvas.height = video.videoHeight;
     return;
  }

  // Desenha o vídeo
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

  if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    const landmarks = results.multiFaceLandmarks[0];

    // Referências (Pontos oficiais MediaPipe)
    const olhoEsquerdo = landmarks[33];
    const olhoDireito = landmarks[263];
    const pontaNariz = landmarks[1];
    const entreOlhos = landmarks[168];

    // Coordenadas
    const x1 = olhoEsquerdo.x * canvas.width;
    const y1 = olhoEsquerdo.y * canvas.height;
    const x2 = olhoDireito.x * canvas.width;
    const y2 = olhoDireito.y * canvas.height;

    const centerX = (x1 + x2) / 2;
    const centerY = (y1 + y2) / 2;
    const larguraFace = Math.hypot(x2 - x1, y2 - y1);
    
    // 1. CORREÇÃO DO ÂNGULO (Invertido para compensar scaleX(-1))
    const angle = Math.atan2(y2 - y1, x2 - x1);

    ctx.translate(centerX, centerY);
    // Aqui está o segredo: invertemos o sinal do ângulo para não ficar torto no espelho
    ctx.rotate(-angle); 

    // 2. MOVIMENTO VERTICAL (Cima/Baixo)
    // Se o nariz desce em relação aos olhos, você olhou para baixo.
    const verticalDist = (pontaNariz.y - entreOlhos.y) * canvas.height;
    const pitchOffset = verticalDist - (larguraFace * 0.4); 
    ctx.translate(0, pitchOffset);

    // 3. MOVIMENTO LATERAL (Direita/Esquerda - Yaw)
    // Invertemos o cálculo para que o óculos vire junto com você no espelho
    const noseX = pontaNariz.x * canvas.width;
    const faceTurn = (centerX - noseX) / larguraFace;

    // Aplicar escala de perspectiva
    ctx.scale(1 - Math.abs(faceTurn) * 0.3, 1);
    // Deslocamento para o lado oposto da rotação (efeito 3D)
    ctx.translate(faceTurn * 40, 0);

    const gWidth = larguraFace * 2.1;
    const gHeight = gWidth * (glassesImg.height / glassesImg.width);

    ctx.drawImage(glassesImg, -gWidth / 2, -gHeight / 2, gWidth, gHeight);
  }
  ctx.restore();
});

// Loop sem travar
async function render() {
  if (video.readyState >= 2) {
    await faceMesh.send({ image: video });
  }
  requestAnimationFrame(render);
}

iniciarCamera().then(() => render());
</script>
</body>
</html>
