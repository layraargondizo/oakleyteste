<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Óculos Virtual - Estável</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
  body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
  
  /* Container para manter a proporção */
  .container { position: relative; width: 100%; max-width: 800px; }

  /* Espelhamento aplicado aqui */
  canvas {
    width: 100%;
    height: auto;
    transform: scaleX(-1); /* Efeito espelho */
    display: block;
  }

  .botoes {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
  }
  button { padding: 12px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
  <video id="input_video" style="display:none"></video>
  <canvas id="output_canvas"></canvas>
  
  <div class="botoes">
    <button onclick="mudarOculos('https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png')">Modelo 1</button>
  </div>
</div>

<script>
const videoElement = document.getElementById('input_video');
const canvasElement = document.getElementById('output_canvas');
const canvasCtx = canvasElement.getContext('2d');

const glassesImg = new Image();
glassesImg.src = "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png";

function onResults(results) {
  // 1. Ajusta o tamanho do canvas ao vídeo (apenas uma vez ou quando mudar)
  if (canvasElement.width !== results.image.width) {
    canvasElement.width = results.image.width;
    canvasElement.height = results.image.height;
  }

  // 2. Limpa e desenha o frame da câmera (O FUNDO)
  canvasCtx.save();
  canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
  canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

  // 3. Desenha o óculos (O OVERLAY)
  if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    const landmarks = results.multiFaceLandmarks[0];
    
    // Pontos chave
    const leftEye = landmarks[33];
    const rightEye = landmarks[263];
    const noseTip = landmarks[1];
    const midEyes = landmarks[168];

    const x1 = leftEye.x * canvasElement.width;
    const y1 = leftEye.y * canvasElement.height;
    const x2 = rightEye.x * canvasElement.width;
    const y2 = rightEye.y * canvasElement.height;

    const centerX = (x1 + x2) / 2;
    const centerY = (y1 + y2) / 2;
    const distance = Math.hypot(x2 - x1, y2 - y1);

    // Cálculos de rotação e inclinação
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const verticalDiff = (noseTip.y - midEyes.y) * canvasElement.height;
    const pitchFactor = verticalDiff / (distance * 0.5);

    const glassesWidth = distance * 2.1;
    const glassesHeight = glassesWidth * (glassesImg.height / glassesImg.width);

    canvasCtx.translate(centerX, centerY);
    canvasCtx.rotate(angle);

    // Ajuste de altura vertical (segue o rosto ao olhar para cima/baixo)
    const pitchOffset = (pitchFactor - 0.75) * (distance * 0.4);
    canvasCtx.translate(0, pitchOffset);

    // Efeito de perspectiva ao virar o rosto (Yaw)
    const noseX = noseTip.x * canvasElement.width;
    const faceTurn = (noseX - centerX) / distance;
    canvasCtx.scale(1 - Math.abs(faceTurn) * 0.25, 1);

    canvasCtx.drawImage(
      glassesImg,
      -glassesWidth / 2,
      -glassesHeight / 2,
      glassesWidth,
      glassesHeight
    );
  }
  canvasCtx.restore();
}

// Configuração do MediaPipe FaceMesh
const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(onResults);

// Gerenciador de câmera mais estável
const camera = new Camera(videoElement, {
  onFrame: async () => {
    await faceMesh.send({image: videoElement});
  },
  width: 1280,
  height: 720
});
camera.start();

function mudarOculos(url) {
  glassesImg.src = url;
}
</script>
</body>
</html>
