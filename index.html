<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Óculos Virtual - Movimento Horizontal Corrigido</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>
  body { margin: 0; overflow: hidden; background: #000; }
  video, canvas {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    max-width: 100%;
  }
  .botoes {
    position: fixed; bottom: 20px; width: 100%; text-align: center; z-index: 10;
  }
  button {
    padding: 10px 15px; margin: 5px; border-radius: 8px; border: none; cursor: pointer;
  }
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div class="botoes">
  <button onclick="trocarOculos(1)">Óculos 1</button>
  <button onclick="trocarOculos(2)">Óculos 2</button>
  <button onclick="trocarOculos(3)">Óculos 3</button>
</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let currentGlassesSrc = "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png";
const glassesImg = new Image();
let oculosCarregado = false;

glassesImg.src = currentGlassesSrc;
glassesImg.onload = () => oculosCarregado = true;

window.trocarOculos = function(id) {
  oculosCarregado = false;
  if (id === 1) currentGlassesSrc = "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png";
  glassesImg.src = currentGlassesSrc;
  glassesImg.onload = () => oculosCarregado = true;
};

async function iniciarCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  return new Promise(resolve => video.onloadedmetadata = resolve);
}

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(results => {
  if (!canvas.width || !canvas.height) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Desenha o vídeo como espelho real
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(results.image, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();

  if (!oculosCarregado || !results.multiFaceLandmarks.length) return;

  // === NÃO invertemos mais os landmarks (melhor abordagem) ===
  const landmarks = results.multiFaceLandmarks[0];

  const leftEye   = landmarks[33];
  const rightEye  = landmarks[263];
  const noseTip   = landmarks[4];

  // Coordenadas na tela (já considerando o espelhamento do vídeo)
  const x1 = (1 - leftEye.x)  * canvas.width;   // invertemos só aqui
  const y1 = leftEye.y  * canvas.height;
  const x2 = (1 - rightEye.x) * canvas.width;
  const y2 = rightEye.y * canvas.height;

  const distance = Math.hypot(x2 - x1, y2 - y1);

  const glassesWidth = distance * 1.92;
  const glassesHeight = glassesWidth * (glassesImg.height / glassesImg.width);

  const centerX = (x1 + x2) / 2;
  const centerY = (y1 + y2) / 2 + distance * 0.12;

  const angle = Math.atan2(y2 - y1, x2 - x1);

  ctx.save();
  ctx.translate(centerX, centerY);
  ctx.rotate(angle);

  // === CÁLCULO DO YAW CORRIGIDO (movimento horizontal) ===
  // Como o vídeo está espelhado, invertemos o sinal do yaw
  const noseScreenX = (1 - noseTip.x) * canvas.width;
  let yaw = (noseScreenX - centerX) / distance;
  yaw = -yaw;                    // ← ESSA LINHA CORRIGE esquerda/direita

  const pitch = ((noseTip.y * canvas.height) - centerY) / (distance * 1.2);

  // Perspectiva
  ctx.scale(1 - Math.abs(yaw) * 0.32, 1);
  ctx.scale(1, 1 - Math.abs(pitch) * 0.27);

  // Deslocamento
  ctx.translate(yaw * 48, pitch * 38);

  // Desenha o óculos com correção vertical (anti ponta-cabeça)
  ctx.save();
  ctx.scale(1, -1);               // corrige inversão vertical da imagem
  ctx.drawImage(glassesImg,
    -glassesWidth / 2,
    -glassesHeight / 2,
    glassesWidth,
    glassesHeight
  );
  ctx.restore();

  ctx.restore();
});

async function loop() {
  if (video.readyState >= 2) {
    await faceMesh.send({ image: video }).catch(() => {});
  }
  requestAnimationFrame(loop);
}

(async () => {
  await iniciarCamera();
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  loop();
})();

</script>
</body>
</html>
