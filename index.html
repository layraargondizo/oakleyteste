<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Óculos Virtual - Acompanhamento Vertical Melhorado</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>
  body { margin: 0; overflow: hidden; background: #000; }
  video, canvas {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    max-width: 100%;
  }
  .botoes {
    position: fixed; bottom: 20px; width: 100%; text-align: center; z-index: 10;
  }
  button {
    padding: 10px 15px; margin: 5px; border-radius: 8px; border: none; cursor: pointer;
  }
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div class="botoes">
  <button onclick="trocarOculos(1)">Óculos 1</button>
  <button onclick="trocarOculos(2)">Óculos 2</button>
  <button onclick="trocarOculos(3)">Óculos 3</button>
</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let currentGlassesSrc = "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png";
const glassesImg = new Image();
let oculosCarregado = false;

glassesImg.src = currentGlassesSrc;
glassesImg.onload = () => oculosCarregado = true;

window.trocarOculos = function(id) {
  oculosCarregado = false;
  if (id === 1) currentGlassesSrc = "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png";
  // Adicione outros óculos aqui
  glassesImg.src = currentGlassesSrc;
  glassesImg.onload = () => oculosCarregado = true;
};

async function iniciarCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  return new Promise(resolve => video.onloadedmetadata = resolve);
}

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(results => {
  if (!canvas.width || !canvas.height) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Desenha vídeo em modo espelho
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(results.image, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();

  if (!oculosCarregado || !results.multiFaceLandmarks.length) return;

  // Inverte landmarks para combinar com o espelho
  const landmarks = results.multiFaceLandmarks[0].map(p => ({
    x: 1 - p.x,
    y: p.y
  }));

  const leftEye   = landmarks[33];
  const rightEye  = landmarks[263];
  const noseTip   = landmarks[4];
  const forehead  = landmarks[10];   // ponto no topo da testa (ajuda no pitch)
  const chin      = landmarks[152];  // ponto no queixo (melhor referência vertical)

  const x1 = leftEye.x  * canvas.width;
  const y1 = leftEye.y  * canvas.height;
  const x2 = rightEye.x * canvas.width;
  const y2 = rightEye.y * canvas.height;

  const distance = Math.hypot(x2 - x1, y2 - y1);
  const glassesWidth = distance * 1.92;
  const glassesHeight = glassesWidth * (glassesImg.height / glassesImg.width);

  // Centro horizontal continua nos olhos
  const centerX = (x1 + x2) / 2;

  // === MELHORIA PRINCIPAL: Cálculo vertical mais inteligente ===
  // Usa média entre olhos + ajuste baseado na rotação da cabeça (testa x queixo)
  const eyeCenterY = (y1 + y2) / 2;
  const headPitch = forehead.y - chin.y;                    // diferença vertical testa-queixo
  const pitchFactor = (headPitch - 0.35) * 2.5;             // normaliza (valor aproximado quando reto)

  // Posição vertical final do óculos (sobe quando olha para cima)
  let centerY = eyeCenterY + distance * 0.12;               // base
  centerY += pitchFactor * distance * 0.45;                 // ajuste forte quando cabeça inclina

  const angle = Math.atan2(y2 - y1, x2 - x1);

  ctx.save();
  ctx.translate(centerX, centerY);
  ctx.rotate(angle);

  // Giro horizontal (Yaw)
  const yaw = ((noseTip.x * canvas.width) - centerX) / distance;

  // Giro vertical (Pitch) - mais sensível agora
  const pitch = (noseTip.y * canvas.height - eyeCenterY) / (distance * 1.1);

  // Perspectiva
  ctx.scale(1 - Math.abs(yaw) * 0.33, 1);
  ctx.scale(1, 1 - Math.abs(pitch) * 0.30);

  // Deslocamento suave
  ctx.translate(yaw * 45, pitch * 40);

  ctx.drawImage(glassesImg,
    -glassesWidth / 2,
    -glassesHeight / 2,
    glassesWidth,
    glassesHeight
  );

  ctx.restore();
});

async function loop() {
  if (video.readyState >= 2) {
    await faceMesh.send({ image: video }).catch(() => {});
  }
  requestAnimationFrame(loop);
}

(async () => {
  await iniciarCamera();
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  loop();
})();

</script>
</body>
</html>
