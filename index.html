<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Óculos Virtual - Versão Estável</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>
  body { margin: 0; overflow: hidden; background: #000; }
  video, canvas {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    max-width: 100%;
  }
  .botoes {
    position: fixed; bottom: 20px; width: 100%; text-align: center; z-index: 10;
  }
  button {
    padding: 10px 15px; margin: 5px; border-radius: 8px; border: none; cursor: pointer;
  }
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div class="botoes">
  <button onclick="trocarOculos(1)">Óculos 1</button>
  <button onclick="trocarOculos(2)">Óculos 2</button>
  <button onclick="trocarOculos(3)">Óculos 3</button>
</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let currentGlassesSrc = "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png";
const glassesImg = new Image();
let oculosCarregado = false;

glassesImg.src = currentGlassesSrc;
glassesImg.onload = () => oculosCarregado = true;

window.trocarOculos = function(id) {
  oculosCarregado = false;
  if (id === 1) currentGlassesSrc = "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png";
  glassesImg.src = currentGlassesSrc;
  glassesImg.onload = () => oculosCarregado = true;
};

async function iniciarCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  return new Promise(resolve => video.onloadedmetadata = resolve);
}

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(results => {
  if (!canvas.width || !canvas.height) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Vídeo espelhado
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(results.image, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();

  if (!oculosCarregado || !results.multiFaceLandmarks.length) return;

  const landmarks = results.multiFaceLandmarks[0];

  // Coordenadas com espelhamento
  const leftEye  = { x: (1 - landmarks[33].x) * canvas.width, y: landmarks[33].y * canvas.height };
  const rightEye = { x: (1 - landmarks[263].x) * canvas.width, y: landmarks[263].y * canvas.height };
  const noseTip  = { x: (1 - landmarks[4].x) * canvas.width, y: landmarks[4].y * canvas.height };

  const distance = Math.hypot(rightEye.x - leftEye.x, rightEye.y - leftEye.y);

  const glassesWidth = distance * 1.9;
  const glassesHeight = glassesWidth * (glassesImg.height / glassesImg.width);

  const centerX = (leftEye.x + rightEye.x) / 2;
  let centerY = (leftEye.y + rightEye.y) / 2 + distance * 0.15;

  const angle = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x);

  ctx.save();
  ctx.translate(centerX, centerY);
  ctx.rotate(angle);

  // Yaw horizontal (movimento esquerda/direita)
  let yaw = (noseTip.x - centerX) / distance;
  yaw = -yaw;   // corrige direção

  // === MELHORIA NO PITCH (olhar para cima/baixo) ===
  const pitch = (noseTip.y - centerY) / distance;

  // Ajuste de posição vertical quando olha para cima
  centerY += pitch * distance * 0.8;     // ← principal mudança para subir junto

  // Perspectiva
  ctx.scale(1 - Math.abs(yaw) * 0.32, 1);
  ctx.scale(1, 1 - Math.abs(pitch) * 0.28);

  ctx.translate(yaw * 48, pitch * 40);

  // Desenha óculos
  ctx.save();
  ctx.scale(1, -1);   // corrige ponta-cabeça
  ctx.drawImage(glassesImg,
    -glassesWidth / 2,
    -glassesHeight / 2,
    glassesWidth,
    glassesHeight
  );
  ctx.restore();

  ctx.restore();
});

async function loop() {
  if (video.readyState >= 2) {
    await faceMesh.send({ image: video }).catch(() => {});
  }
  requestAnimationFrame(loop);
}

(async () => {
  await iniciarCamera();
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  loop();
})();

</script>
</body>
</html>
