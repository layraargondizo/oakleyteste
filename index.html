<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Óculos Virtual - Proporcional</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>
  body { margin: 0; overflow: hidden; background: #000; }

  video, canvas {
    position: absolute;
    left: 50%;
    /* MODIFICAÇÃO 1: Adicionado scaleX(-1) para efeito de espelho */
    transform: translateX(-50%) scaleX(-1);
    max-width: 100%;
  }

  .botoes {
    position: fixed;
    bottom: 20px;
    width: 100%;
    text-align: center;
    z-index: 10;
  }

  button { padding: 10px 15px; margin: 5px; border-radius: 8px; border: none; cursor: pointer; }
</style>
</head>

<body>

<video id="video" autoplay playsinline style="display:none;"></video>
<canvas id="canvas"></canvas>

<div class="botoes">
  <button onclick="trocarOculos(1)">Óculos 1</button>
  <button onclick="trocarOculos(2)">Óculos 2</button>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const glassesImg = new Image();
let oculosCarregado = false;
glassesImg.src = "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png";
glassesImg.onload = () => { oculosCarregado = true; };

async function iniciarCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
  video.srcObject = stream;
  return new Promise(resolve => { video.onloadedmetadata = () => resolve(); });
}

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.npmmirror.com/package/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(results => {
  if (!canvas.width || !canvas.height) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

  if (!oculosCarregado) return;

  if (results.multiFaceLandmarks.length > 0) {
    const landmarks = results.multiFaceLandmarks[0];

    // Pontos de referência
    const leftEye = landmarks[33];
    const rightEye = landmarks[263];
    const nose = landmarks[1];
    const upperNose = landmarks[6]; // Ponto entre os olhos

    const x1 = leftEye.x * canvas.width;
    const y1 = leftEye.y * canvas.height;
    const x2 = rightEye.x * canvas.width;
    const y2 = rightEye.y * canvas.height;

    const distance = Math.hypot(x2 - x1, y2 - y1);
    const centerX = (x1 + x2) / 2;
    const centerY = (y1 + y2) / 2;

    const angle = Math.atan2(y2 - y1, x2 - x1);

    // MODIFICAÇÃO 2: OFFSET VERTICAL DINÂMICO
    // Em vez de fixo, ele usa a posição do ponto 6 (entre os olhos)
    const dynamicOffsetY = (upperNose.y * canvas.height) - centerY;

    ctx.save();
    
    // Posiciona o óculos no centro dos olhos + o ajuste do nariz
    ctx.translate(centerX, centerY + dynamicOffsetY);
    ctx.rotate(angle);

    // MODIFICAÇÃO 3: CÁLCULO DE GIRO INVERTIDO (para o espelho)
    const noseX = nose.x * canvas.width;
    // Invertemos a ordem da subtração para o óculos virar pro lado certo no espelho
    const faceTurn = centerX - noseX; 
    const perspective = faceTurn / distance;

    const glassesWidth = distance * 2.0;
    const aspectRatio = glassesImg.height / glassesImg.width;
    const glassesHeight = glassesWidth * aspectRatio;

    // Aplicar perspectiva (yaw)
    ctx.scale(1 - Math.abs(perspective) * 0.4, 1);
    ctx.translate(perspective * 40, 0);

    ctx.drawImage(
      glassesImg,
      -glassesWidth / 2,
      -glassesHeight / 2,
      glassesWidth,
      glassesHeight
    );

    ctx.restore();
  }
});

async function loop() {
  if (video.readyState >= 2) {
    await faceMesh.send({ image: video });
  }
  requestAnimationFrame(loop);
}

(async () => {
  await iniciarCamera();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  loop();
})();
</script>
</body>
</html>
