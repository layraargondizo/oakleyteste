<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Teste Óculos</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
}
canvas {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}
</style>
</head>

<body>

<video id="video" autoplay playsinline style="display:none;"></video>
<canvas id="canvas"></canvas>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// 🔥 IMAGEM DO ÓCULOS (FIXA)
const glasses = new Image();
glasses.src = "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png";

// câmera
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;

  return new Promise(resolve => {
    video.onloadedmetadata = () => resolve();
  });
}

// mediapipe
const faceMesh = new FaceMesh({
  locateFile: (file) =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(results => {

  if (!canvas.width) return;

  // limpa
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 🔥 ESPELHA VÍDEO
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(results.image, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();

  if (!results.multiFaceLandmarks.length) return;

  const lm = results.multiFaceLandmarks[0];

  // olhos
  const left = lm[33];
  const right = lm[263];

  // 🔥 CONVERTE + ESPELHA X
  const x1 = (1 - left.x) * canvas.width;
  const y1 = left.y * canvas.height;

  const x2 = (1 - right.x) * canvas.width;
  const y2 = right.y * canvas.height;

  // centro
  const cx = (x1 + x2) / 2;
  const cy = (y1 + y2) / 2;

  // distância
  const dist = Math.hypot(x2 - x1, y2 - y1);

  // tamanho simples
  const w = dist * 2.0;
  const h = w * (glasses.height / glasses.width);

  // rotação
  const angle = Math.atan2(y2 - y1, x2 - x1);

  ctx.save();

  ctx.translate(cx, cy);
  ctx.rotate(angle);

  ctx.drawImage(glasses, -w/2, -h/2, w, h);

  ctx.restore();
});

// loop
async function loop() {
  if (video.readyState >= 2) {
    await faceMesh.send({ image: video });
  }
  requestAnimationFrame(loop);
}

// init
(async () => {
  await startCamera();

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  loop();
})();

</script>

</body>
</html>
