<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Óculos Virtual 3D Simulado</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
  video, canvas {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    max-width: 100%;
  }
  .botoes {
    position: fixed; bottom: 20px; width: 100%; text-align: center; z-index: 10;
  }
  button {
    padding: 10px 15px; margin: 5px; border-radius: 8px; border: none; cursor: pointer;
    background: white; font-weight: bold;
  }
</style>
</head>
<body>

<video id="video" autoplay playsinline style="display:none;"></video>
<canvas id="canvas"></canvas>

<div class="botoes">
  <button onclick="trocarOculos('https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png')">Modelo 1</button>
  </div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const glassesImg = new Image();
let oculosCarregado = false;
glassesImg.src = "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png";
glassesImg.onload = () => oculosCarregado = true;

function trocarOculos(url) {
    oculosCarregado = false;
    glassesImg.src = url;
}

async function iniciarCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
  video.srcObject = stream;
  return new Promise(resolve => video.onloadedmetadata = resolve);
}

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(results => {
  if (!results.multiFaceLandmarks.length) {
      // Se não detectar rosto, apenas desenha o vídeo
      ctx.save();
      ctx.scale(-1, 1);
      ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
      ctx.restore();
      return;
  };

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. DESENHA O VÍDEO ESPELHADO
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(results.image, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();

  if (!oculosCarregado) return;

  const lm = results.multiFaceLandmarks[0];

  // PONTOS CHAVE (Usando índices do FaceMesh)
  const olhoEsq = lm[33];   // Canto externo olho esquerdo
  const olhoDir = lm[263];  // Canto externo olho direito
  const nariz = lm[1];      // Ponta do nariz (Centro)
  const ponteNariz = lm[168]; // Entre os olhos (onde o óculos apoia)

  // Coordenadas convertidas para o Canvas (invertendo o X por causa do espelhamento)
  const xE = (1 - olhoEsq.x) * canvas.width;
  const xD = (1 - olhoDir.x) * canvas.width;
  const yE = olhoEsq.y * canvas.height;
  const yD = olhoDir.y * canvas.height;
  
  const xN = (1 - ponteNariz.x) * canvas.width;
  const yN = ponteNariz.y * canvas.height;

  // 2. CÁLCULOS DE DIMENSÃO E ÂNGULO
  const larguraOculos = Math.hypot(xD - xE, yD - yE) * 2.2; 
  const alturaOculos = larguraOculos * (glassesImg.height / glassesImg.width);
  const inclinacao = Math.atan2(yD - yE, xD - xE);

  // 3. SIMULAÇÃO 3D (YAW - Rotação lateral)
  // Calculamos a diferença de proporção entre o nariz e os olhos
  const distEsq = Math.abs(xN - xE);
  const distDir = Math.abs(xD - xN);
  
  // O fator de escala reduz a largura da imagem conforme o rosto vira
  // Se distEsq e distDir forem muito diferentes, o rosto está de lado
  const faceRoll = distEsq / distDir;
  let scaleX = 1;
  
  // Limita a distorção para não ficar bizarro
  if (faceRoll > 1) scaleX = 1 / (faceRoll * 0.8);
  else scaleX = faceRoll * 1.2;
  scaleX = Math.min(Math.max(scaleX, 0.5), 1); // Clamp entre 0.5 e 1

  // 4. DESENHO
  ctx.save();
  
  // Move para a ponte do nariz
  ctx.translate(xN, yN);
  
  // Aplica a rotação (inclinação da cabeça)
  ctx.rotate(inclinacao + Math.PI);
  
  // Aplica a escala horizontal para o efeito 3D
  ctx.scale(scaleX, 1);

  // Desenha centralizado no ponto do nariz
  // O ajuste no "y" (-alturaOculos * 0.35) é para subir o óculos do nariz para os olhos
  ctx.drawImage(glassesImg, -larguraOculos/2, -alturaOculos * 0.45, larguraOculos, alturaOculos);

  ctx.restore();
});

async function loop() {
  if (video.readyState >= 2) {
    await faceMesh.send({ image: video });
  }
  requestAnimationFrame(loop);
}

(async () => {
  await iniciarCamera();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  loop();
})();
</script>
</body>
</html>
