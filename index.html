<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Óculos Virtual - Câmera (Melhorado)</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #000;
  }

  video, canvas {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    max-width: 100%;
  }

  .botoes {
    position: fixed;
    bottom: 20px;
    width: 100%;
    text-align: center;
    z-index: 10;
  }

  button {
    padding: 10px 15px;
    margin: 5px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div class="botoes">
  <button onclick="trocarOculos(1)">Óculos 1</button>
  <button onclick="trocarOculos(2)">Óculos 2</button>
  <button onclick="trocarOculos(3)">Óculos 3</button>
</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let currentGlassesSrc = "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png";
const glassesImg = new Image();
let oculosCarregado = false;

glassesImg.src = currentGlassesSrc;

glassesImg.onload = () => {
  oculosCarregado = true;
};

// Função para trocar os óculos (você pode adicionar mais URLs aqui)
window.trocarOculos = function(id) {
  oculosCarregado = false;
  if (id === 1) currentGlassesSrc = "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png";
  else if (id === 2) currentGlassesSrc = "https://exemplo.com/oculos2.png"; // ← substitua pelos seus links
  else if (id === 3) currentGlassesSrc = "https://exemplo.com/oculos3.png";

  glassesImg.src = currentGlassesSrc;
  glassesImg.onload = () => { oculosCarregado = true; };
};

// câmera
async function iniciarCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;

  return new Promise(resolve => {
    video.onloadedmetadata = () => {
      resolve();
    };
  });
}

// MediaPipe
const faceMesh = new FaceMesh({
  locateFile: (file) => {
    return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
  }
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(results => {

  if (!canvas.width || !canvas.height) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // === MELHORIA 1: EFEITO ESPELHO (corrige a inversão esquerda/direita) ===
  // Desenha o vídeo espelhado + inverte as coordenadas dos landmarks
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(results.image, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();

  if (!oculosCarregado) return;

  if (results.multiFaceLandmarks.length > 0) {
    // Copia os landmarks e inverte o eixo X (para combinar com o vídeo espelhado)
    let landmarks = results.multiFaceLandmarks[0].map(point => ({
      ...point,
      x: 1 - point.x   // ← aqui acontece o espelhamento dos pontos
    }));

    const leftEye  = landmarks[33];
    const rightEye = landmarks[263];

    const x1 = leftEye.x  * canvas.width;
    const y1 = leftEye.y  * canvas.height;
    const x2 = rightEye.x * canvas.width;
    const y2 = rightEye.y * canvas.height;

    const distance = Math.hypot(x2 - x1, y2 - y1);

    const glassesWidth  = distance * 1.9;
    const aspectRatio   = glassesImg.height / glassesImg.width;
    const glassesHeight = glassesWidth * aspectRatio;

    const centerX = (x1 + x2) / 2;
    const centerY = (y1 + y2) / 2;

    const angle = Math.atan2(y2 - y1, x2 - x1);
    const offsetY = distance * 0.1;

    ctx.save();

    ctx.translate(centerX, centerY + offsetY);
    ctx.rotate(angle);

    // === CÁLCULO DE GIRO (Yaw) - já existia ===
    const nose = landmarks[4];                    // índice correto do nariz (tip)
    const noseX = nose.x * canvas.width;
    const faceTurn = noseX - centerX;
    const perspective = faceTurn / distance;

    // === MELHORIA 2: PERSPECTIVA VERTICAL (Pitch) - olhar para cima/baixo ===
    const noseY = nose.y * canvas.height;
    const facePitch = noseY - centerY;               // quanto maior, mais para baixo
    const verticalPerspective = facePitch / distance;

    // Aplicar perspectiva fake horizontal (lado a lado)
    ctx.scale(1 - Math.abs(perspective) * 0.3, 1);

    // Aplicar perspectiva fake vertical (cima/baixo) - agora o óculos acompanha!
    ctx.scale(1, 1 - Math.abs(verticalPerspective) * 0.25);

    // Deslocamento horizontal
    ctx.translate(perspective * 50, 0);

    // Deslocamento vertical (ajuste fino para acompanhar o movimento da cabeça)
    ctx.translate(0, verticalPerspective * 35);

    ctx.drawImage(
      glassesImg,
      -glassesWidth / 2,
      -glassesHeight / 2,
      glassesWidth,
      glassesHeight
    );

    ctx.restore();
  }
});

// loop estável
async function loop() {
  if (video.readyState >= 2) {
    try {
      await faceMesh.send({ image: video });
    } catch (e) {
      console.log("erro mediapipe:", e);
    }
  }
  requestAnimationFrame(loop);
}

// 🔥 INICIALIZAÇÃO
(async () => {
  await iniciarCamera();

  // Define tamanho do canvas (usa a resolução real da câmera)
  canvas.width  = video.videoWidth  || 640;
  canvas.height = video.videoHeight || 480;

  loop();
})();

</script>

</body>
</html>
