<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Óculos Virtual</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #000;
  }

  video, canvas {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    max-width: 100%;
  }

  .botoes {
    position: fixed;
    bottom: 20px;
    width: 100%;
    text-align: center;
    z-index: 10;
  }

  button {
    padding: 10px 15px;
    margin: 5px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div class="botoes">
  <button onclick="trocarOculos(1)">Óculos 1</button>
  <button onclick="trocarOculos(2)">Óculos 2</button>
  <button onclick="trocarOculos(3)">Óculos 3</button>
</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let glassesImg = new Image();
let oculosCarregado = false;

const modelos = {
  1: "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png",
  2: "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png",
  3: "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png"
};

function trocarOculos(id) {
  oculosCarregado = false;
  glassesImg = new Image();
  glassesImg.src = modelos[id];
  glassesImg.onload = () => oculosCarregado = true;
}

// inicia com modelo 1
trocarOculos(1);

// câmera
async function iniciarCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;

  return new Promise(resolve => {
    video.onloadedmetadata = () => resolve();
  });
}

// MediaPipe
const faceMesh = new FaceMesh({
  locateFile: (file) =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

// 🔥 AQUI ESTÁ A MÁGICA (100% CORRIGIDO)
faceMesh.onResults(results => {

  if (!canvas.width || !canvas.height) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 🔥 ESPELHA O VÍDEO (SELFIE)
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(results.image, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();

  if (!oculosCarregado) return;
  if (!results.multiFaceLandmarks.length) return;

  const landmarks = results.multiFaceLandmarks[0];

  // 🔥 FUNÇÃO PRA CORRIGIR X
  function p(lm) {
    return {
      x: (1 - lm.x) * canvas.width,
      y: lm.y * canvas.height
    };
  }

  const leftEye = p(landmarks[33]);
  const rightEye = p(landmarks[263]);
  const nose = p(landmarks[1]);

  const x1 = leftEye.x;
  const y1 = leftEye.y;
  const x2 = rightEye.x;
  const y2 = rightEye.y;

  const distance = Math.hypot(x2 - x1, y2 - y1);

  const glassesWidth = distance * 2.0;
  const aspectRatio = glassesImg.height / glassesImg.width;
  const glassesHeight = glassesWidth * aspectRatio;

  const centerX = (x1 + x2) / 2;
  const centerY = (y1 + y2) / 2;

  const angle = Math.atan2(y2 - y1, x2 - x1);

  const offsetY = distance * 0.12;

  ctx.save();

  ctx.translate(centerX, centerY + offsetY);
  ctx.rotate(angle);

  // 🔥 PERSPECTIVA
  const faceTurn = nose.x - centerX;
  const perspective = faceTurn / distance;

  ctx.scale(1 - Math.abs(perspective) * 0.25, 1);
  ctx.translate(perspective * 30, 0);

  ctx.drawImage(
    glassesImg,
    -glassesWidth / 2,
    -glassesHeight / 2,
    glassesWidth,
    glassesHeight
  );

  ctx.restore();
});

// loop
async function loop() {
  if (video.readyState >= 2) {
    await faceMesh.send({ image: video });
  }
  requestAnimationFrame(loop);
}

// init
(async () => {
  await iniciarCamera();

  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;

  loop();
})();

</script>

</body>
</html>
