<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Óculos Virtual - Espelho Correto</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  video, canvas {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    max-width: 100%;
  }
  .botoes {
    position: fixed; bottom: 20px; width: 100%; text-align: center; z-index: 10;
  }
  button {
    padding: 10px 15px; margin: 5px; border-radius: 8px; border: none; cursor: pointer;
  }
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div class="botoes">
  <button onclick="trocarOculos(1)">Óculos 1</button>
  <button onclick="trocarOculos(2)">Óculos 2</button>
  <button onclick="trocarOculos(3)">Óculos 3</button>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const glassesImg = new Image();
let oculosCarregado = false;
glassesImg.src = "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png";
glassesImg.onload = () => oculosCarregado = true;

async function iniciarCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  return new Promise(resolve => video.onloadedmetadata = resolve);
}

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(results => {

  if (!canvas.width || !canvas.height) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 🔥 ESPELHA VÍDEO
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(results.image, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();

  if (!oculosCarregado) return;
  if (!results.multiFaceLandmarks.length) return;

  const lm = results.multiFaceLandmarks[0];

  const left = lm[33];
  const right = lm[263];

  const x1 = (1 - left.x) * canvas.width;
  const y1 = left.y * canvas.height;

  const x2 = (1 - right.x) * canvas.width;
  const y2 = right.y * canvas.height;

  const cx = (x1 + x2) / 2;
  const cy = (y1 + y2) / 2;

  const dist = Math.hypot(x2 - x1, y2 - y1);

  const w = dist * 2.0;
  const h = w * (glassesImg.height / glassesImg.width);

  const angle = Math.atan2(y2 - y1, x2 - x1);

  ctx.save();

  ctx.translate(cx, cy);

  // 🔥 AQUI É A CORREÇÃO DO ÓCULOS VIRADO
  ctx.rotate(angle + Math.PI);

  ctx.drawImage(glassesImg, -w/2, -h/2, w, h);

  ctx.restore();
});

async function loop() {
  if (video.readyState >= 2) {
    await faceMesh.send({ image: video }).catch(() => {});
  }
  requestAnimationFrame(loop);
}

(async () => {
  await iniciarCamera();
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  loop();
})();
</script>
</body>
</html>
