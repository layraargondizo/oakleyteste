<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Óculos Virtual - Espelho com Nariz Travado</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  video, canvas {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    max-width: 100%;
  }
  .botoes {
    position: fixed; bottom: 20px; width: 100%; text-align: center; z-index: 10;
  }
  button {
    padding: 10px 15px; margin: 5px; border-radius: 8px; border: none; cursor: pointer;
    background: #333; color: white;
  }
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div class="botoes">
  <button onclick="trocarOculos(1)">Óculos 1</button>
  <button onclick="trocarOculos(2)">Óculos 2</button>
  <button onclick="trocarOculos(3)">Óculos 3</button>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let currentGlasses = 1;
const glassesImg = new Image();
let oculosCarregado = false;

function carregarOculos(num) {
  currentGlasses = num;
  // Troque as URLs pelas suas imagens de óculos (com fundo transparente)
  const urls = {
    1: "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png",
    2: "https://sua-url-oculos2.png",   // ← coloque aqui
    3: "https://sua-url-oculos3.png"    // ← coloque aqui
  };
  glassesImg.src = urls[num] || urls[1];
  glassesImg.onload = () => oculosCarregado = true;
}

carregarOculos(1);

async function iniciarCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  return new Promise(resolve => video.onloadedmetadata = resolve);
}

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(results => {
  if (!canvas.width || !canvas.height) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Espelha o vídeo (efeito espelho)
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(results.image, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();

  if (!oculosCarregado || !results.multiFaceLandmarks.length) return;

  const lm = results.multiFaceLandmarks[0];

  // === PONTOS IMPORTANTES ===
  const leftEye     = lm[33];   // canto externo olho esquerdo
  const rightEye    = lm[263];  // canto externo olho direito
  const noseBridge  = lm[168];  // ponte do nariz (topo)
  const noseTip     = lm[1];    // ponta do nariz (mais baixo)

  // Coordenadas na tela (já espelhadas)
  const ex1 = (1 - leftEye.x) * canvas.width;
  const ey1 = leftEye.y * canvas.height;
  const ex2 = (1 - rightEye.x) * canvas.width;
  const ey2 = rightEye.y * canvas.height;

  const nx1 = (1 - noseBridge.x) * canvas.width;   // ponte
  const ny1 = noseBridge.y * canvas.height;
  const nx2 = (1 - noseTip.x) * canvas.width;      // ponta
  const ny2 = noseTip.y * canvas.height;

  // Centro aproximado entre os olhos + um pouco para baixo (nariz)
  const centerX = (ex1 + ex2) / 2;
  const centerY = (ey1 + ey2) / 2 + (ny1 - (ey1 + ey2)/2) * 0.4; // leve ajuste para baixo

  // Largura baseada na distância entre os olhos
  const eyeDistance = Math.hypot(ex2 - ex1, ey2 - ey1);
  let width = eyeDistance * 2.15;   // ajuste esse valor conforme seu modelo de óculos

  // Altura proporcional à imagem
  let height = width * (glassesImg.height / glassesImg.width);

  // Ângulo de rotação baseado na linha dos olhos
  const angle = Math.atan2(ey2 - ey1, ex2 - ex1);

  ctx.save();
  ctx.translate(centerX, centerY);
  ctx.rotate(angle);

  // Desenha o óculos centralizado
  ctx.drawImage(glassesImg, -width/2, -height/2.1, width, height); 
  // O -height/2.1 ajuda a subir um pouco o óculos no nariz

  ctx.restore();
});

async function loop() {
  if (video.readyState >= 2) {
    await faceMesh.send({ image: video }).catch(() => {});
  }
  requestAnimationFrame(loop);
}

(async () => {
  await iniciarCamera();
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  loop();
})();

// Função dos botões
window.trocarOculos = function(num) {
  carregarOculos(num);
};
</script>
</body>
</html>
