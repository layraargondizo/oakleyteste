<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Óculos Virtual</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>
  body {
    font-family: Arial;
    text-align: center;
  }

  #modalCamera {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    z-index:9999;
  }

  video, canvas {
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    max-width:100%;
  }

  .botoes {
    position:absolute;
    bottom:20px;
    width:100%;
    text-align:center;
    z-index:10;
  }

  button {
    padding:10px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
  }
</style>
</head>

<body>

<button onclick="abrirCamera()">Experimentar Óculos</button>

<div id="modalCamera">

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <button onclick="fecharCamera()" style="position:absolute; top:20px; right:20px; z-index:10;">
    Fechar
  </button>

  <div class="botoes">
    <button onclick="trocarOculos(1)">1</button>
    <button onclick="trocarOculos(2)">2</button>
    <button onclick="trocarOculos(3)">3</button>
  </div>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let streamGlobal = null;

// lista de óculos
const oculosLista = {
  1: "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png",
  2: "https://i.imgur.com/VKQZ5bP.png",
  3: "https://i.imgur.com/8Qf6JpD.png"
};

const glassesImg = new Image();
let oculosCarregado = false;

function trocarOculos(id){
  oculosCarregado = false;
  glassesImg.src = oculosLista[id];
}

glassesImg.onload = () => {
  oculosCarregado = true;
};

// padrão inicial
trocarOculos(1);

// abrir câmera
async function abrirCamera(){
  document.getElementById("modalCamera").style.display = "block";

  streamGlobal = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user" }
  });

  video.srcObject = streamGlobal;

  video.onloadedmetadata = () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  };
}

// fechar câmera
function fecharCamera(){
  document.getElementById("modalCamera").style.display = "none";

  if(streamGlobal){
    streamGlobal.getTracks().forEach(track => track.stop());
  }
}

// MediaPipe
const faceMesh = new FaceMesh({
  locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces:1,
  refineLandmarks:true
});

// suavização
let smoothX=0, smoothY=0, smoothScale=0;

faceMesh.onResults(results => {

  if(!canvas.width) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();

ctx.scale(-1, 1);
ctx.drawImage(results.image, -canvas.width, 0, canvas.width, canvas.height);

ctx.restore();

  if(!oculosCarregado) return;

  if(results.multiFaceLandmarks.length > 0){

const lm = results.multiFaceLandmarks[0];

const leftEye = lm[33];
const rightEye = lm[263];
const nose = lm[1];

// 🔥 espelhamento correto
const x1 = canvas.width - (leftEye.x * canvas.width);
const y1 = leftEye.y * canvas.height;

const x2 = canvas.width - (rightEye.x * canvas.width);
const y2 = rightEye.y * canvas.height;

const noseX = canvas.width - (nose.x * canvas.width);
const noseY = nose.y * canvas.height;

// 🔥 garante ordem correta (evita inverter óculos)
const dx = x2 - x1;
const dy = y2 - y1;

const distance = Math.hypot(dx, dy);

const glassesWidth = distance * 2.1;
const aspectRatio = glassesImg.height / glassesImg.width;
const glassesHeight = glassesWidth * aspectRatio;

const centerX = (x1 + x2) / 2;
const eyeCenterY = (y1 + y2) / 2;

// 🔥 correção vertical (olhar pra cima/baixo)
const faceTilt = noseY - eyeCenterY;
const centerY = eyeCenterY + (faceTilt * 0.6);

// 🔥 ângulo corrigido (resolve virar de cabeça pra baixo)
const angle = Math.atan2(dy, dx);

// 🔥 offset mais natural
const offsetY = distance * 0.05;

// 🔥 suavização MAIS RÁPIDA (menos delay)
smoothX += (centerX - smoothX) * 0.4;
smoothY += (centerY - smoothY) * 0.4;
smoothScale += (glassesWidth - smoothScale) * 0.4;

// 🔥 perspectiva lateral
const faceTurn = noseX - centerX;
const perspective = faceTurn / distance;

// 🔥 DESENHO FINAL (SEM SOMBRA)
ctx.save();

ctx.translate(smoothX, smoothY + offsetY);
ctx.rotate(angle);

// perspectiva
ctx.scale(1 - Math.abs(perspective) * 0.25, 1);
ctx.translate(perspective * 40, 0);

ctx.drawImage(
  glassesImg,
  -smoothScale / 2,
  -glassesHeight / 2,
  smoothScale,
  glassesHeight
);

ctx.restore();

    // 🔥 ÓCULOS
    ctx.save();
    ctx.translate(smoothX, smoothY + offsetY);
    ctx.rotate(angle);

    ctx.scale(1 - Math.abs(perspective)*0.3,1);
    ctx.translate(perspective*50,0);

    ctx.filter = "none";
    ctx.globalAlpha = 1;

    ctx.drawImage(
      glassesImg,
      -smoothScale/2,
      -glassesHeight/2,
      smoothScale,
      glassesHeight
    );

    ctx.restore();
  }
});

// loop
async function loop(){
  if(video.readyState >= 2){
    try{
      await faceMesh.send({image: video});
    }catch(e){}
  }
  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
