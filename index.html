<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Óculos Virtual 3D Simulado</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  video, canvas {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    max-width: 100%;
  }
  .botoes {
    position: fixed; bottom: 20px; width: 100%; text-align: center; z-index: 10;
  }
  button {
    padding: 10px 15px; margin: 5px; border-radius: 8px; border: none; cursor: pointer;
    background: #fff; font-weight: bold;
  }
</style>
</head>
<body>

<video id="video" autoplay playsinline style="display:none;"></video>
<canvas id="canvas"></canvas>

<div class="botoes">
  <button onclick="trocarOculos('https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png')">Modelo 1</button>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const glassesImg = new Image();
let oculosCarregado = false;
// Usando sua imagem original
glassesImg.src = "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png";
glassesImg.onload = () => oculosCarregado = true;

function trocarOculos(url) {
  oculosCarregado = false;
  glassesImg.src = url;
}

async function iniciarCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ 
    video: { width: 1280, height: 720 } 
  });
  video.srcObject = stream;
  return new Promise(resolve => video.onloadedmetadata = resolve);
}

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(results => {
  if (!canvas.width || !canvas.height) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. DESENHA O VÍDEO ESPELHADO (Fundo)
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(results.image, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();

  if (!oculosCarregado || !results.multiFaceLandmarks.length) return;

  const lm = results.multiFaceLandmarks[0];

  // PONTOS CHAVE
  const olhoEsq = lm[33];   // Canto externo esquerdo
  const olhoDir = lm[263];  // Canto externo direito
  const ponteNariz = lm[168]; // Ponto exato entre os olhos (onde o óculos apoia)

  // Conversão de coordenadas (invertendo o X por causa do espelhamento do canvas)
  const xE = (1 - olhoEsq.x) * canvas.width;
  const xD = (1 - olhoDir.x) * canvas.width;
  const yE = olhoEsq.y * canvas.height;
  const yD = olhoDir.y * canvas.height;
  
  const xN = (1 - ponteNariz.x) * canvas.width;
  const yN = ponteNariz.y * canvas.height;

  // CÁLCULOS BÁSICOS
  const larguraBase = Math.hypot(xD - xE, yD - yE) * 2.1; // Ajuste de escala do óculos
  const alturaBase = larguraBase * (glassesImg.height / glassesImg.width);
  const angulo = Math.atan2(yD - yE, xD - xE);

  // SIMULAÇÃO DE ROTAÇÃO 3D (YAW)
  // Medimos a proporção entre o nariz e os olhos para saber se o rosto virou
  const distEsq = Math.abs(xN - xE);
  const distDir = Math.abs(xD - xN);
  
  // Fator de escala horizontal (quanto mais de lado, mais "fino" o óculos fica)
  let ratio = distEsq / distDir;
  if (ratio > 1) ratio = 1 / ratio; 
  
  // Suaviza a distorção (evita que o óculos suma se virar demais)
  const scaleX = Math.max(ratio * 1.3, 0.6); 

  // DESENHO DO ÓCULOS
  ctx.save();
  
  // Move para a ponte do nariz (âncora central)
  ctx.translate(xN, yN);
  
  // Aplica a rotação da inclinação da cabeça
  ctx.rotate(angulo + Math.PI);
  
  // Aplica o achatamento horizontal (Simulação 3D)
  ctx.scale(scaleX, 1);

  // Desenha a imagem. 
  // O "-alturaBase * 0.45" serve para subir o óculos um pouco acima do ponto do nariz
  ctx.drawImage(glassesImg, -larguraBase/2, -alturaBase * 0.45, larguraBase, alturaBase);

  ctx.restore();
});

async function loop() {
  if (video.readyState >= 2) {
    await faceMesh.send({ image: video }).catch(() => {});
  }
  requestAnimationFrame(loop);
}

(async () => {
  await iniciarCamera();
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  loop();
})();
</script>
</body>
</html>
