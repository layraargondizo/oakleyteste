<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Óculos Virtual - Espelho Perfeito</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  video, canvas {
    position: absolute;
    left: 50%;
    /* Mantendo seu espelho CSS */
    transform: translateX(-50%) scaleX(-1);
    max-width: 100%;
    height: auto;
  }
  .botoes { position: fixed; bottom: 20px; width: 100%; text-align: center; z-index: 10; }
  button { padding: 12px 20px; margin: 5px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; background: #fff; color: #333; }
</style>
</head>
<body>
<video id="video" autoplay playsinline style="opacity: 0;"></video>
<canvas id="canvas"></canvas>
<div class="botoes">
  <button onclick="trocarOculos(1)">Óculos 1</button>
  <button onclick="trocarOculos(2)">Óculos 2</button>
</div>
<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const glassesImg = new Image();
let oculosCarregado = false;
glassesImg.src = "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png";
glassesImg.onload = () => { oculosCarregado = true; };

async function iniciarCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 } } });
    video.srcObject = stream;
    return new Promise(resolve => {
      video.onloadedmetadata = () => { video.play(); resolve(); };
    });
  } catch (err) { alert("Erro ao acessar a câmera: " + err); }
}

const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

faceMesh.onResults(results => {
  if (canvas.width !== video.videoWidth) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

  if (oculosCarregado && results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    const landmarks = results.multiFaceLandmarks[0];

    // PONTOS CHAVE (Pontos oficiais MediaPipe)
    const olhoEsquerdoRaw = landmarks[33];   // Canto externo olho esquerdo
    const olhoDireitoRaw = landmarks[263]; // Canto externo olho direito
    const bridgeNose = landmarks[6];    // Ponto exato entre os olhos (Glabela)
    const noseTip = landmarks[1];       // Ponta do nariz

    const x1Raw = olhoEsquerdoRaw.x * canvas.width;
    const y1Raw = olhoEsquerdoRaw.y * canvas.height;
    const x2Raw = olhoDireitoRaw.x * canvas.width;
    const y2Raw = olhoDireitoRaw.y * canvas.height;

    // --- CORREÇÃO 1: ENCAIXE VERTICAL (Descer da testa) ---
    // Usamos a ponte do nariz como âncora vertical, pois é mais estável.
    const centerX = (x1Raw + x2Raw) / 2;
    const centerY = bridgeNose.y * canvas.height;
    const distance = Math.hypot(x2Raw - x1Raw, y2Raw - y1Raw);
    const angle = Math.atan2(y2Raw - y1Raw, x2Raw - x1Raw);

    ctx.save();
    
    // Posicionamento centralizado na ponte do nariz. Sem offset manual aqui.
    ctx.translate(centerX, centerY);
    ctx.rotate(angle);

    // --- CORREÇÃO 2: GIRO LATERAL (YAW) E PROFUNDIDADE ---
    const noseX = noseTip.x * canvas.width;
    // Cálculo do giro em relação ao centro do rosto (usando X bruto)
    const faceTurn = (noseX) - (centerX);
    // Perspectiva simulada: quanto maior o giro, maior o achatamento lateral
    const perspectiveYaw = faceTurn / distance;

    // --- CORREÇÃO 3: INCLINAÇÃO (PITCH) CIMA/BAIXO ---
    // Invertemos o cálculo para que ao olhar para cima, o óculos suba.
    const verticalDist = (bridgeNose.y * canvas.height) - (noseTip.y * canvas.height);
    // Ajuste fino do ponto de encaixe vertical. Aumente este número para descer o óculos.
    const pitchOffset = (verticalDist * -1) - (distance * 0.15); 
    ctx.translate(0, pitchOffset);

    const glassesWidth = distance * 2.1;
    const aspectRatio = glassesImg.height / glassesImg.width;
    const glassesHeight = glassesWidth * aspectRatio;

    // Perspectiva fake: achata o óculos ao virar o rosto (yaw)
    ctx.scale(1 - Math.abs(perspectiveYaw) * 0.35, 1);
    
    // --- COMPENSAÇÃO DO ESPELHO (IMPORTANTE) ---
    // O deslocamento lateral agora é invertido para combater a inversão do CSS.
    // Isso faz com que o lado "para trás" encurte e o óculos se mova para lá, na direção correta.
    ctx.translate(perspectiveYaw * -20, 0); 

    ctx.drawImage(
      glassesImg,
      -glassesWidth / 2,
      -glassesHeight / 2,
      glassesWidth,
      glassesHeight
    );

    ctx.restore();
  }
});

async function loop() {
  if (video.readyState >= 2) { await faceMesh.send({ image: video }); }
  requestAnimationFrame(loop);
}

(async () => { await iniciarCamera(); loop(); })();

function trocarOculos(modelo) {
  const base_url = "https://images.tcdn.com.br/img/editor/up/1360466/";
  if (modelo === 1) glassesImg.src = base_url + "com_sombra.png";
}
</script>
</body>
</html>
