<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Óculos Virtual - Sem Congelar</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  video, canvas {
    position: absolute;
    left: 50%;
    transform: translateX(-50%) scaleX(-1);
    max-width: 100%;
    height: auto;
  }
  .botoes { position: fixed; bottom: 20px; width: 100%; text-align: center; z-index: 10; }
  button { padding: 12px; margin: 5px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>

<!-- Video visível mas com opacidade 0 evita alguns bugs de renderização em navegadores mobile -->
<video id="video" autoplay playsinline style="opacity: 0; pointer-events: none;"></video>
<canvas id="canvas"></canvas>

<div class="botoes">
  <button onclick="glassesImg.src='https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png'">Resetar Óculos</button>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const glassesImg = new Image();
let oculosCarregado = false;
glassesImg.src = "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png";
glassesImg.onload = () => { oculosCarregado = true; };

async function iniciarCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ 
    video: { width: { ideal: 640 }, height: { ideal: 480 } } 
  });
  video.srcObject = stream;
  return new Promise(resolve => {
    video.onloadedmetadata = () => {
      video.play();
      resolve();
    };
  });
}

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(results => {
  // Ajusta o tamanho do canvas dinamicamente para evitar distorção
  if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

  if (oculosCarregado && results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    const landmarks = results.multiFaceLandmarks[0];

    const x1 = landmarks[33].x * canvas.width;
    const y1 = landmarks[33].y * canvas.height;
    const x2 = landmarks[263].x * canvas.width;
    const y2 = landmarks[263].y * canvas.height;

    const distance = Math.hypot(x2 - x1, y2 - y1);
    const centerX = (x1 + x2) / 2;
    const centerY = (y1 + y2) / 2;
    
    // Sincronizado com o seu código "perfeito" + correções de espelho
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const offsetY = distance * 0.15; // Ajuste para descer o óculos

    ctx.save();
    ctx.translate(centerX, centerY + offsetY);
    ctx.rotate(-angle); 

    const noseX = landmarks[1].x * canvas.width;
    const faceTurn = centerX - noseX; 
    const perspective = faceTurn / distance;

    ctx.scale(1 - Math.abs(perspective) * 0.3, 1);
    ctx.translate(-perspective * 50, 0); 

    const gWidth = distance * 1.9;
    const gHeight = gWidth * (glassesImg.height / glassesImg.width);

    ctx.drawImage(glassesImg, -gWidth / 2, -gHeight / 2, gWidth, gHeight);
    ctx.restore();
  }
});

async function loop() {
  // SÓ envia para o MediaPipe se o vídeo estiver realmente rodando
  if (video.readyState >= 2 && video.videoWidth > 0) {
    await faceMesh.send({ image: video });
  }
  requestAnimationFrame(loop);
}

// Inicialização com tratamento de erro
iniciarCamera().then(() => {
  console.log("Câmera OK, iniciando loop...");
  loop();
}).catch(err => console.error("Falha na câmera:", err));

</script>
</body>
</html>
