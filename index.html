<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Óculos Virtual - Versão Final</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>
  body { margin: 0; overflow: hidden; background: #000; }

  /* Espelhamento via CSS */
  video, canvas {
    position: absolute;
    left: 50%;
    transform: translateX(-50%) scaleX(-1);
    max-width: 100%;
    height: auto;
  }

  .botoes {
    position: fixed;
    bottom: 20px;
    width: 100%;
    text-align: center;
    z-index: 10;
  }

  button { padding: 12px 20px; margin: 5px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; background: #fff; }
</style>
</head>

<body>

<!-- Deixamos o vídeo visível com opacidade 0 para garantir que o navegador o processe -->
<video id="video" autoplay playsinline style="opacity: 0;"></video>
<canvas id="canvas"></canvas>

<div class="botoes">
  <button onclick="trocarOculos('https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png')">Modelo 1</button>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const glassesImg = new Image();
let oculosCarregado = false;
glassesImg.src = "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png";
glassesImg.onload = () => { oculosCarregado = true; };

async function iniciarCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { width: { ideal: 640 }, height: { ideal: 480 } } 
    });
    video.srcObject = stream;
    return new Promise(resolve => {
      video.onloadedmetadata = () => {
        video.play();
        resolve();
      };
    });
  } catch (err) {
    alert("Erro ao acessar a câmera: " + err);
  }
}

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(results => {
  // Garante que o canvas tenha o tamanho do vídeo
  if (canvas.width !== video.videoWidth) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

  if (oculosCarregado && results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    const landmarks = results.multiFaceLandmarks[0];

    // PONTOS CHAVE
    const leftEye = landmarks[33];   // Canto externo olho esquerdo
    const rightEye = landmarks[263]; // Canto externo olho direito
    const bridge = landmarks[168];   // Ponto exato entre os olhos (Glabela)
    const nose = landmarks[1];       // Ponta do nariz

    const x1 = leftEye.x * canvas.width;
    const y1 = leftEye.y * canvas.height;
    const x2 = rightEye.x * canvas.width;
    const y2 = rightEye.y * canvas.height;

    const centerX = bridge.x * canvas.width;
    const centerY = bridge.y * canvas.height;
    const distance = Math.hypot(x2 - x1, y2 - y1);
    const angle = Math.atan2(y2 - y1, x2 - x1);

    ctx.save();
    
    // Posicionamento centralizado na ponte do nariz
    ctx.translate(centerX, centerY);
    ctx.rotate(angle);

    // GIRO LATERAL (YAW) - Corrigido para o modo espelho
    const faceTurn = (nose.x * canvas.width) - (bridge.x * canvas.width);
    const perspective = faceTurn / distance;

    // MOVIMENTO VERTICAL (PITCH)
    // Calcula a inclinação baseada na distância vertical entre os olhos e a ponta do nariz
    const verticalDist = (nose.y - bridge.y) * canvas.height;
    const pitchOffset = verticalDist - (distance * 0.25); // 0.25 é o ajuste fino do "encaixe"

    ctx.translate(0, pitchOffset);

    const glassesWidth = distance * 2.1;
    const aspectRatio = glassesImg.height / glassesImg.width;
    const glassesHeight = glassesWidth * aspectRatio;

    // Perspectiva fake: achata o óculos ao virar o rosto
    ctx.scale(1 - Math.abs(perspective) * 0.3, 1);
    // Compensa o deslocamento lateral da perspectiva
    ctx.translate(perspective * -20, 0);

    ctx.drawImage(
      glassesImg,
      -glassesWidth / 2,
      -glassesHeight / 2,
      glassesWidth,
      glassesHeight
    );

    ctx.restore();
  }
});

async function loop() {
  if (video.readyState >= 2) {
    await faceMesh.send({ image: video });
  }
  requestAnimationFrame(loop);
}

(async () => {
  await iniciarCamera();
  loop();
})();

function trocarOculos(url) {
  glassesImg.src = url;
}
</script>
</body>
</html>
