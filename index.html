<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Óculos Virtual - Correção de Eixos</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  video, canvas {
    position: absolute;
    left: 50%;
    /* Mantendo o espelho CSS que você quer */
    transform: translateX(-50%) scaleX(-1);
    max-width: 100%;
    height: auto;
  }
  .botoes { position: fixed; bottom: 20px; width: 100%; text-align: center; z-index: 10; }
  button { padding: 10px 15px; margin: 5px; border-radius: 8px; cursor: pointer; font-weight: bold; background: #fff; color: #333; }
</style>
</head>
<body>
<video id="video" autoplay playsinline style="opacity: 0;"></video>
<canvas id="canvas"></canvas>
<div class="botoes">
  <button onclick="glassesImg.src='https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png'">Óculos 1</button>
</div>
<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const glassesImg = new Image();
glassesImg.src = "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png";

async function iniciarCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { width: { ideal: 640 }, height: { ideal: 480 } } 
    });
    video.srcObject = stream;
    return new Promise(resolve => {
      video.onloadedmetadata = () => { video.play(); resolve(); };
    });
  } catch (err) { alert("Erro ao acessar a câmera: " + err); }
}

const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

faceMesh.onResults(results => {
  if (canvas.width !== video.videoWidth) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

  if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    const landmarks = results.multiFaceLandmarks[0];

    // PONTOS CHAVE (Oficiais MediaPipe)
    const olhoEsquerdo = landmarks[33];   // Canto externo esquerdo
    const olhoDireito = landmarks[263];  // Canto externo direito
    const pontaNariz = landmarks[1];      // Ponta do nariz
    const glabela = landmarks[168];      // Ponto entre os olhos (Bridge)

    const x1 = olhoEsquerdo.x * canvas.width;
    const y1 = olhoEsquerdo.y * canvas.height;
    const x2 = olhoDireito.x * canvas.width;
    const y2 = olhoDireito.y * canvas.height;

    const centerX = (x1 + x2) / 2;
    // Posição vertical inicial baseada nos olhos
    const centerYEyes = (y1 + y2) / 2;
    
    const distance = Math.hypot(x2 - x1, y2 - y1);
    const angle = Math.atan2(y2 - y1, x2 - x1);

    ctx.save();
    
    // Posicionamento centralizado na linha dos olhos
    ctx.translate(centerX, centerYEyes);
    // Invertemos o ângulo para não ficar torto no espelho
    ctx.rotate(-angle); 

    // --- CORREÇÃO DE INCLINAÇÃO VERTICAL (PITCH) ---
    // Calculamos a distância vertical entre o nariz e o ponto entre os olhos
    const verticalDist = (pontaNariz.y - glabela.y) * canvas.height;
    // INVERTEMOS O SINAL: Ao olhar para cima, o óculos deve SUBIR.
    // O ajuste fino '- (distance * 0.1)' desce o óculos um pouco, cobrindo melhor os olhos.
    const pitchOffset = (verticalDist * -1) - (distance * 0.1); 
    ctx.translate(0, pitchOffset);

    // --- CORREÇÃO DE GIRO LATERAL (YAW) ---
    const noseX = pontaNariz.x * canvas.width;
    // INVERTEMOS O CÁLCULO: (nariz - centro). Ao virar para a direita (do espelho), o óculos diminui no lado correto.
    const faceTurn = (noseX - centerX);
    // Perspectiva simulada: quanto maior o giro, maior o achatamento lateral
    const perspectiveYaw = faceTurn / distance;

    const glassesWidth = distance * 2.1;
    const aspectRatio = glassesImg.height / glassesImg.width;
    const glassesHeight = glassesWidth * aspectRatio;

    // Perspectiva fake: achata o óculos ao virar o rosto (yaw)
    ctx.scale(1 - Math.abs(perspectiveYaw) * 0.35, 1);
    
    // --- COMPENSAÇÃO DO ESPELHO ---
    // O deslocamento lateral agora é invertido para combater a inversão do CSS.
    // Isso faz com que o lado "para trás" encurte e o óculos se mova para lá, na direção correta.
    ctx.translate(perspectiveYaw * -20, 0); 

    ctx.drawImage(
      glassesImg,
      -glassesWidth / 2,
      -glassesHeight / 2,
      glassesWidth,
      glassesHeight
    );

    ctx.restore();
  }
});

async function loop() {
  if (video.readyState >= 2) { await faceMesh.send({ image: video }); }
  requestAnimationFrame(loop);
}

(async () => { await iniciarCamera(); loop(); })();
</script>
</body>
</html>
