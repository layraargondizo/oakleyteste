<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Óculos Virtual - Correção Espelho</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  video, canvas {
    position: absolute;
    left: 50%;
    /* O espelho que você quer */
    transform: translateX(-50%) scaleX(-1);
    max-width: 100%;
  }
  .botoes { position: fixed; bottom: 20px; width: 100%; text-align: center; z-index: 10; }
  button { padding: 10px 15px; margin: 5px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>

<video id="video" autoplay playsinline style="display:none;"></video>
<canvas id="canvas"></canvas>

<div class="botoes">
  <button onclick="glassesImg.src='https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png'">Óculos 1</button>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const glassesImg = new Image();
glassesImg.src = "https://images.tcdn.com.br/img/editor/up/1360466/com_sombra.png";

async function iniciarCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  return new Promise(resolve => { video.onloadedmetadata = () => resolve(); });
}

const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(results => {
  if (!canvas.width || !canvas.height) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

  if (results.multiFaceLandmarks.length > 0) {
    const landmarks = results.multiFaceLandmarks[0];

    // Pontos dos Olhos
    const eyeLeft = landmarks[33];
    const eyeRight = landmarks[263];
    const noseTip = landmarks[1];
    const forehead = landmarks[151]; // Ponto acima entre as sobrancelhas

    const x1 = eyeLeft.x * canvas.width;
    const y1 = eyeLeft.y * canvas.height;
    const x2 = eyeRight.x * canvas.width;
    const y2 = eyeRight.y * canvas.height;

    // --- POSICIONAMENTO ---
    const centerX = (x1 + x2) / 2;
    // Descemos o centerY: usamos a média dos olhos e somamos um ajuste leve
    const centerY = (y1 + y2) / 2 + (Math.hypot(x2 - x1, y2 - y1) * 0.05);
    
    const distance = Math.hypot(x2 - x1, y2 - y1);
    const angle = Math.atan2(y2 - y1, x2 - x1);

    ctx.save();
    ctx.translate(centerX, centerY);
    
    // Invertemos o ângulo para compensar o espelho do CSS
    ctx.rotate(-angle); 

    // --- CORREÇÃO DE GIRO LATERAL (YAW) ---
    const noseX = noseTip.x * canvas.width;
    // Invertido para o modo espelho
    const faceTurn = (centerX - noseX); 
    const perspective = faceTurn / distance;

    // --- CORREÇÃO DE INCLINAÇÃO (PITCH) ---
    // Calculamos a distância entre testa e nariz para saber se olhou pra cima/baixo
    const headTilt = (noseTip.y - forehead.y) * canvas.height;
    const expectedDist = distance * 0.8; // Proporção base do rosto
    const pitchShift = (headTilt - expectedDist) * 0.3;

    ctx.translate(0, pitchShift);

    const glassesWidth = distance * 2.0;
    const aspectRatio = glassesImg.height / glassesImg.width;
    const glassesHeight = glassesWidth * aspectRatio;

    // Perspectiva: Encurta o lado que "se afasta" do espelho
    ctx.scale(1 - Math.abs(perspective) * 0.4, 1);
    
    // Deslocamento lateral para dar profundidade (ajustado para espelho)
    ctx.translate(-perspective * 30, 0);

    ctx.drawImage(
      glassesImg,
      -glassesWidth / 2,
      -glassesHeight / 2,
      glassesWidth,
      glassesHeight
    );

    ctx.restore();
  }
});

async function loop() {
  if (video.readyState >= 2) { await faceMesh.send({ image: video }); }
  requestAnimationFrame(loop);
}

(async () => {
  await iniciarCamera();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  loop();
})();
</script>
</body>
</html>
